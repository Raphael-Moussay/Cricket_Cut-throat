<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cricket Cut-throat — Dart Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Oswald:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="app.css" />
</head>
<body class="min-h-screen bg-[#0e1218] text-slate-100 antialiased selection:bg-amber-500/30 selection:text-amber-200">
  <div id="app" class="max-w-5xl mx-auto p-3 sm:p-4"></div>

  <div id="winModal" class="fixed inset-0 hidden items-center justify-center bg-black/85 backdrop-blur-sm p-4 z-50">
    <div class="modal-panel w-full max-w-md rounded-3xl p-6 shadow-2xl border border-amber-400/20 text-white">
      <div class="text-center">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-400/15 text-amber-300 text-xs uppercase font-bold tracking-widest border border-amber-400/30 font-oswald">
          🎯 Victoire au tableau
        </div>
        <div id="winTitle" class="mt-3 text-3xl sm:text-4xl font-bold tracking-wide text-amber-300 font-oswald"></div>
        <div id="winSubtitle" class="mt-1 text-sm text-slate-300 font-medium"></div>
        
        <div class="mt-6">
          <div class="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-2 text-left font-oswald">Tableau des scores</div>
          <div id="winRanking" class="space-y-2"></div>
        </div>
        
        <button id="winClose" class="mt-6 w-full rounded-2xl bg-amber-400 px-4 py-3.5 text-base font-bold text-slate-950 font-oswald tracking-wider uppercase shadow-lg shadow-amber-400/20 hover:bg-amber-300 active:scale-[0.99] transition-all">Nouvelle manche</button>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
