<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cricket Cut-throat — Neo-Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="app.css" />
</head>
<body class="min-h-screen bg-[#05070c] text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-300">
  <div id="app" class="max-w-5xl mx-auto p-3 sm:p-4"></div>

  <div id="winModal" class="fixed inset-0 hidden items-center justify-center bg-black/90 backdrop-blur-md p-4 z-50">
    <div class="modal-panel w-full max-w-md rounded-3xl p-6 shadow-2xl border-2 border-cyan-500/30 text-white">
      <div class="text-center">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-500/10 text-cyan-300 text-xs uppercase font-extrabold tracking-widest border border-cyan-500/30 font-chakra">
          ⚡ MATCH CHAMPION
        </div>
        <div id="winTitle" class="mt-3 text-3xl sm:text-4xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-emerald-300 to-amber-300 font-chakra"></div>
        <div id="winSubtitle" class="mt-1 text-sm text-slate-400 font-medium"></div>
        
        <div class="mt-6">
          <div class="text-xs uppercase tracking-wider text-slate-400 font-extrabold mb-2 text-left font-chakra">Tableau des scores</div>
          <div id="winRanking" class="space-y-2"></div>
        </div>
        
        <button id="winClose" class="mt-6 w-full rounded-2xl bg-gradient-to-r from-cyan-400 to-emerald-400 px-4 py-3.5 text-base font-extrabold text-slate-950 font-chakra uppercase tracking-wider shadow-lg shadow-cyan-500/30 hover:brightness-110 active:scale-[0.99] transition-all">Partie suivante</button>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
