<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Cricket Cut-throat — Pro</title>
  <meta name="theme-color" content="#090b10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="app.css" />
</head>
<body class="min-h-screen bg-[#090b10] text-slate-100 antialiased selection:bg-emerald-500/30 selection:text-emerald-300">
  <div id="app" class="max-w-5xl mx-auto p-3 sm:p-4"></div>

  <div id="winModal" class="fixed inset-0 hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4 z-50">
    <div class="modal-panel w-full max-w-md rounded-3xl p-6 shadow-2xl border border-white/10 text-white">
      <div class="text-center">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-400/10 text-amber-300 text-xs uppercase font-bold tracking-widest border border-amber-400/20">
          🏆 Victoire
        </div>
        <div id="winTitle" class="mt-3 text-3xl font-black tracking-tight text-white font-chakra"></div>
        <div id="winSubtitle" class="mt-1 text-sm text-slate-400 font-medium"></div>
        
        <div class="mt-6">
          <div class="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-2 text-left">Classement Final</div>
          <div id="winRanking" class="space-y-2"></div>
        </div>
        
        <button id="winClose" class="mt-6 w-full rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-400 px-4 py-3.5 text-base font-bold text-slate-950 shadow-lg shadow-emerald-500/20 hover:brightness-110 active:scale-[0.99] transition-all">Rejouer une partie</button>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
